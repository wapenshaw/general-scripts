  web: openai-codex/gpt-6.1-terra:high
  vision: openai-codex/gpt-6.1-terra:medium
  task: openai-codex/gpt-6-luna:xhigh
hideThinkingBlock: false
omitThinking: false
expandThinkingBlocks: true
disabledProviders:
  - alibaba-coding-plan
  - amazon-bedrock
  - antigravity-cli
  - apple
  - azure
  - bifrost
  - cerebras
  - charm-hyper
  - cline-pass
  - cloudflare-ai-gateway
  - commandcode
  - cursor
  - deepseek
  - factory-droid
  - fireworks
  - github-copilot
  - google
  - google-antigravity
  - google-gemini-cli
  - google-vertex
  - groq
  - huggingface
  - kilo
  - kimi-code
  - kiro
  - litellm
  - llama.cpp
  - lm-studio
  - minimax
  - minimax-cn
  - minimax-code
  - minimax-code-cn
  - mistral
  - modular
  - moonshot
  - muse-code
  - nanogpt
  - nvidia
  - ollama
  - ollama-cloud
  - openrouter
  - opencode
  - qwen-portal
  - together
  - vercel-ai-gateway
  - venice
  - workers-ai
  - xai
  - xiaomi
  - xiaomi-token-plan-ams
  - xiaomi-token-plan-cn
  - xiaomi-token-plan-sgp
  - zai
  - zenmux
compaction:
  thresholdTokens: 400000
  idleEnabled: true
  idleThresholdTokens: 150000
  idleTimeoutSeconds: 3000
  modelThresholds:
    anthropic/claude-haiku-5-5: 80%
    anthropic/claude-haiku-4-5: 80%
    anthropic/claude-haiku-4-5-20251001: 80%
    anthropic/claude-opus-4-5: 80%
    anthropic/claude-opus-4-5-20251101: 80%
    anthropic/claude-sonnet-4-5: 80%
    anthropic/claude-sonnet-4-5-20250929: 80%
    openai-codex/gpt-5.6-luna: f350000
    openai-codex/gpt-5.6-sol: f350000
    openai-codex/gpt-5.6-terra: 80%
    openai-codex/gpt-6-astra: f350000
    openai-codex/gpt-6-luna: f350000
    openai-codex/gpt-6-sol: f350000
    openai-codex/gpt-6.1-sol: f350000
    openai-codex/gpt-6.2-astra: f350000
    openai-codex/gpt-6.2-sol: f350000
enabledModels:
  - anthropic/claude-opus-5-5
  - anthropic/claude-sonnet-5-5
  - anthropic/claude-haiku-5-5
  - anthropic/claude-fable-5-2
  - openai-codex/gpt-6.2-astra
  - openai-codex/gpt-6.2-sol
  - openai-codex/gpt-6-luna:xhigh
  - openai-codex/gpt-6.1-terra
modelPresets:
  claude:
    modelRoles:
      default: anthropic/claude-sonnet-5-5:high
      smol: anthropic/claude-haiku-5-5:high
      slow: anthropic/claude-opus-5-5:high
      advisor: openai-codex/gpt-6.2-sol:high
      memory: openai-codex/gpt-6-luna:xhigh
      web: openai-codex/gpt-6.1-terra:high
      vision: openai-codex/gpt-6.1-terra:medium
      task: openai-codex/gpt-6-luna:xhigh
    defaultThinkingLevel: high
  codex:
    modelRoles:
      default: openai-codex/gpt-6.2-sol:high
      smol: openai-codex/gpt-6-luna:xhigh
      slow: openai-codex/gpt-6.2-sol:high
      advisor: anthropic/claude-opus-5-5:high
      memory: openai-codex/gpt-6-luna:xhigh
      web: openai-codex/gpt-6-luna:xhigh
      vision: openai-codex/gpt-6.1-terra:medium
      task: openai-codex/gpt-6-luna:xhigh
    defaultThinkingLevel: high
  cheap:
    modelRoles:
      default: anthropic/claude-haiku-5-5:high
      smol: anthropic/claude-haiku-5-5:high
      slow: anthropic/claude-sonnet-5-5:high
      advisor: anthropic/claude-sonnet-5-5:high
      memory: openai-codex/gpt-6-luna:xhigh
      web: openai-codex/gpt-6-luna:high
      vision: openai-codex/gpt-6.1-terra:medium
      task: openai-codex/gpt-6-luna:xhigh
    defaultThinkingLevel: high
extendedContext: true
advisor:
  enabled: true
  reviewMode: agent-end
enabledProviders:
  - claude
memory:
  backend: mnemopi
mnemopi:
  llmMode: smol
  noEmbeddings: true
retry:
  fallbackChains:
    memory:
      - anthropic/claude-haiku-5-5:high
    advisor:
      - anthropic/claude-fable-5-2:medium
todo:
  eager: preferred
task:
  maxConcurrency: 3
  maxRecursionDepth: 1
  agentModelOverrides:
    security-reviewer: openai-codex/gpt-6.2-sol:high
  disabledAgents: []
statusLine:
  transparent: false
  preset: custom
  separator: powerline
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 60
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    time:
      format: 24h
      showSeconds: true
  leftSegments:
    - model
    - mode
    - path
    - git
    - subagents
  rightSegments:
    - session_name
    - token_in
    - token_out
    - cache_read
    - cache_write
    - token_rate
    - cache
    - cost
    - context_pct
    - context_total
