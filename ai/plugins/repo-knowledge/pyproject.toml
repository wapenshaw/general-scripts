[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "repo-knowledge-mcp"
version = "0.1.0"
description = "Project-scoped document retrieval with explicit status and provenance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.scripts]
repo-knowledge = "repo_knowledge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_knowledge"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "pyproject.toml", "install.sh"]
