[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "outlook-mail-mcp"
version = "0.1.0"
description = "Read-only MCP server for the running classic Outlook (Windows COM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "pywin32>=311; sys_platform == 'win32'"]

[project.scripts]
outlook-mail = "outlook_mail.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_mail"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "pyproject.toml"]
